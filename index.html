<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Storyboarder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storyboarder">
<meta name="theme-color" content="#333333">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <header id="toolbar">
    <div class="tb-group group_tools" id="tools"></div>

    <div class="tb-group group_colors">
      <div class="color-column">
        <button id="curColorBtn" class="current-color" aria-label="颜色"></button>
        <input id="size" class="brush-size" type="range" min="1" max="60" value="8" aria-label="笔刷大小">
      </div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="tb-group group_icons">
      <button class="tb-btn" data-act="bucket" aria-label="填充"><svg class="icon"><use href="#icon-fill"></use></svg></button>
      <button class="tb-btn" data-act="trash" aria-label="清空画布"><svg class="icon"><use href="#icon-trash"></use></svg></button>
      <button class="tb-btn" data-act="undo" aria-label="撤销"><svg class="icon"><use href="#icon-undo"></use></svg></button>
      <button class="tb-btn" data-act="redo" aria-label="重做"><svg class="icon"><use href="#icon-redo"></use></svg></button>
    </div>

    <div class="tb-group group_guides">
      <button class="tb-btn guide" data-guide="grid" aria-label="网格"><svg class="icon"><use href="#icon-grid"></use></svg></button>
      <button class="tb-btn guide" data-guide="center" aria-label="中心线"><svg class="icon"><use href="#icon-center"></use></svg></button>
      <button class="tb-btn guide" data-guide="thirds" aria-label="三分线"><svg class="icon"><use href="#icon-thirds"></use></svg></button>
      <button class="tb-btn guide" id="onionBtn" aria-label="洋葱皮"><svg class="icon"><use href="#icon-onion"></use></svg></button>
      <button class="tb-btn guide" id="captionBtn" aria-label="台词字幕"><svg class="icon"><use href="#icon-caption"></use></svg></button>
    </div>

    <div class="tb-spacer"></div>
    <button class="tb-btn" id="menuBtn" aria-label="菜单">⋯</button>
  </header>

  <div id="sketch-body">
    <div id="sketch-pane"><canvas id="c" width="1280" height="720"></canvas></div>

    <aside id="board-metadata">
      <div class="bm-scroll">
        <div class="shot-row"><svg class="ic"><use href="#icon-board"></use></svg><span>Shot:</span><input id="shotName" type="text" value="1" autocomplete="off"></div>
        <div class="bm-line" id="boardCounter">Board: 1 of 1</div>
        <div class="bm-line"><svg class="ic"><use href="#icon-linemileage"></use></svg><span id="lineMiles">0.0</span> line miles</div>
        <div class="hardrule"></div>

        <label class="check"><input type="checkbox" id="newShot"><span>New Shot?</span></label>

        <div class="bm-label"><svg class="ic"><use href="#icon-duration"></use></svg>Duration</div>
        <div class="two-col">
          <input id="durMs" type="text" placeholder="ms" inputmode="numeric">
          <input id="durFrames" type="text" placeholder="frames" inputmode="numeric">
        </div>

        <div class="bm-label"><svg class="ic"><use href="#icon-dialogue"></use></svg>Dialogue</div>
        <textarea id="dialogue" placeholder=""></textarea>

        <div class="bm-label"><svg class="ic"><use href="#icon-action"></use></svg>Action</div>
        <textarea id="action" placeholder=""></textarea>

        <div class="bm-label"><svg class="ic"><use href="#icon-notes"></use></svg>Notes
          <button class="mini" id="clearNotesBtn">Clear</button>
        </div>
        <textarea id="notes" placeholder=""></textarea>

        <div class="bm-label"><svg class="ic"><use href="#icon-lightbox"></use></svg>Layer <span id="layerName">ink</span></div>
        <div class="two-col">
          <button class="flat" id="clearLayerBtn">Clear Layer</button>
          <button class="flat" id="mergeDownBtn">Merge Down</button>
        </div>
        <button class="flat" id="mergeUpBtn">Merge Up</button>

        <div class="hardrule"></div>
        <div class="bm-label">Scene</div>
        <div class="row-inline"><span class="dim">Frame Rate</span>
          <select id="fps">
            <option>12</option><option>15</option><option>24</option><option>25</option><option>30</option>
          </select><span class="dim">fps</span>
        </div>

        <div class="hardrule"></div>
        <input id="projName" class="proj-name" type="text" placeholder="项目名 / Project" autocomplete="off">
        <div class="bm-line dim" id="storeLine"></div>
      </div>
    </aside>
  </div>

  <div id="thumbnail-container">
    <div id="thumbnail-drawer"></div>
    <button id="addFrame" class="thumb-add" aria-label="添加画板">+</button>
  </div>

  <div id="seek"><i id="seekFill"></i></div>

  <div id="playback">
    <div class="stats" id="leftStats">
      <div class="stats-primary" id="statTime">0:00</div>
      <div class="stats-secondary" id="statInfo">BOARD 1 OF 1</div>
    </div>
    <div id="transport">
      <button class="tr-btn" data-act="prev" aria-label="上一板"><svg viewBox="0 0 24 18"><path d="M9 9 19 2v14zM2 2h3v14H2z"/></svg></button>
      <button class="tr-btn play" data-act="play" id="playBtn" aria-label="播放"><svg viewBox="0 0 24 18"><path d="M3 1.5 21 9 3 16.5z"/></svg></button>
      <button class="tr-btn" data-act="next" aria-label="下一板"><svg viewBox="0 0 24 18"><path d="M15 9 5 2v14zM19 2h3v14h-3z"/></svg></button>
    </div>
    <div class="stats right" id="rightStats">
      <div class="stats-primary" id="statTotal">0:02</div>
      <div class="stats-secondary" id="statFps">12 FPS</div>
    </div>
  </div>
</div>

<div id="scrim"></div>

<div id="menu-pop" class="hidden">
  <button data-m="new">New Project</button>
  <button data-m="import">Import Project JSON</button>
  <div class="sep"></div>
  <button data-m="dup">Duplicate Board</button>
  <button data-m="del">Delete Board</button>
  <div class="sep"></div>
  <button data-m="pdf">Export PDF</button>
  <button data-m="png">Export PNG</button>
  <button data-m="json">Export Project JSON</button>
  <div class="sep"></div>
  <label class="menu-check"><input type="checkbox" id="pencilOnly"><span>仅 Apple Pencil 绘制</span></label>
</div>

<input id="color" type="color" value="#111111" hidden>
<input type="file" id="fileInput" accept="application/json,.json" hidden>
