name: Storyboarder
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  Storyboarder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Storyboarder/Sources
      - path: Storyboarder/Assets.xcassets
        buildPhase: resources
      - path: Storyboarder/www
        type: folder
        buildPhase: resources
    info:
      path: Storyboarder/Info.plist
      properties:
        CFBundleDisplayName: Storyboarder
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakuraentropia.storyboarder
        PRODUCT_NAME: Storyboarder
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Storyboarder:
    build:
      targets:
        Storyboarder: all
    run:
      config: Debug
    archive:
      config: Release
